name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Official documentation: https://github.com/actions/setup-node
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      # Tutorial checker: self-test on synthetic logs, no QNX SDK needed.
      - name: Self-test the tutorial checker
        run: bash tutorial/test-check-run.sh
      # Historical evidence: re-checks the console retained from the 9 November 2026 boot.
      # This does not boot QNX; it only confirms the stored console still satisfies the checker.
      - name: Check the retained console of 9 November 2026
        run: bash tutorial/check-run.sh evidence/qemu-run-name-20261109/qemu-serial-console.txt
      # Simulation: a real MCP client starts src/server.mjs over stdio, lists the tools and
      # compiles through a FAKE compiler. It proves the client-server conversation, not QNX.
      - name: Simulated MCP client-server conversation (fake compiler, no QNX)
        run: |
          node scripts/smoke.mjs --fake --evidence-root "$RUNNER_TEMP/smoke-fake"
          cat "$RUNNER_TEMP"/smoke-fake/*/report.md >> "$GITHUB_STEP_SUMMARY"
